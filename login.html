<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIDAAN AI – Login</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #0f1b3d, #1e3c72);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  width: 90%;
  max-width: 380px;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h1 {
  text-align: center;
  color: #1e3c72;
  margin-bottom: 5px;
}

p {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #3f5bd8;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #2f49b5;
}

#error {
  color: red;
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>
  <div class="card">
    <h1>NIDAAN AI</h1>
    <p>Secure access to SS Rig Assistant</p>

    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="login()">Login</button>
    <div id="error"></div>
  </div>

<script>
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === "admin" && p === "nidaan123") {
    document.cookie = "nidaan_auth=true; path=/";
    window.location.href = "/chat";
  } else {
    document.getElementById("error").innerText = "Invalid credentials";
  }
}
</script>
</body>
</html>
