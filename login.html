<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#075e54,#128c7e);
  font-family:"Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, sans-serif;
}

/* LOGIN CARD */
.card{
  background:#ffffff;
  padding:32px;
  width:320px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

h2{
  margin-bottom:6px;
  color:#075e54;
  font-weight:600;
}

p{
  font-size:13px;
  color:#555;
  margin-bottom:20px;
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:22px;
  border:1px solid #9fd6c9;
  font-size:15px;
  outline:none;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:22px;
  background:#128c7e;
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#0f7a6d;
}

/* ERROR */
#error{
  color:#c62828;
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>NIDAAN</h2>
  <p>Secure Access to SS Rig AI-Powered Assistant</p>

  <input id="u" placeholder="Username">
  <input id="p" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <div id="error"></div>
</div>

<script>
function login(){
  const u=document.getElementById("u").value;
  const p=document.getElementById("p").value;

  if(u==="admin" && p==="nidaan123"){
    document.cookie="nidaan_auth=true; path=/";
    window.location.href="/chat";
  }else{
    document.getElementById("error").innerText="Invalid credentials";
  }
}
</script>

</body>
</html>
