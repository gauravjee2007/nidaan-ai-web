<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NIDAAN AI – Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1c2f, #1e3c72);
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 30px 28px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-card h1 {
      margin: 0;
      font-size: 26px;
      color: #1e3c72;
      letter-spacing: 1px;
    }

    .login-card p {
      margin: 6px 0 22px;
      font-size: 14px;
      color: #666;
    }

    label {
      display: block;
      text-align: left;
      font-size: 13px;
      margin-bottom: 6px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1e3c72;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4b63e6, #3a4fcf);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    .error {
      margin-top: 12px;
      font-size: 13px;
      color: #d93025;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>NIDAAN AI</h1>
    <p>Secure access to SS Rig Assistant</p>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username" autocomplete="off"/>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password"/>

    <button onclick="login()">Login</button>

    <div id="error" class="error"></div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorEl = document.getElementById("error");

      errorEl.innerText = "";

      if (!username || !password) {
        errorEl.innerText = "Username and password required";
        return;
      }

      try {
        const res = await fetch("/do-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        if (res.ok) {
          window.location.href = "/chat";
        } else {
          errorEl.innerText = "Invalid credentials";
        }
      } catch (err) {
        errorEl.innerText = "Server error. Try again.";
      }
    }

    // Enter key support
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
  </script>

</body>
</html>
