<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – SS Rig Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Times New Roman", serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, #0a2a43, #1c3f5f);
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 2px;
  box-shadow: inset 0 -2px 6px rgba(255,255,255,0.15);
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* ===== MESSAGE BASE ===== */
.message {
  max-width: 80%;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  line-height: 1.5;
  position: relative;
  word-wrap: break-word;
  font-size: 17px;
}

/* ===== AI MESSAGE ===== */
.message.ai {
  background: linear-gradient(145deg, #ffffff, #eef3f8);
  align-self: flex-start;
}

/* ===== USER MESSAGE ===== */
.message.user {
  background: #7ed957;
  color: #083d14;
  align-self: flex-end;
}

/* ===== TIMESTAMP ===== */
.timestamp {
  font-size: 12px;
  color: #777;
  margin-top: 6px;
  text-align: right;
}

/* ===== THINKING & TYPING ===== */
.thinking {
  background: #d9f5e2;
  color: #0a5c2c;
  font-style: italic;
}

.typing {
  background: #fff3cd;
  color: #7a5a00;
  font-style: italic;
}

/* ===== ALARM / CODE HIGHLIGHT ===== */
.code {
  color: #c1121f;
  font-weight: bold;
}

/* ===== FOOTER ===== */
footer {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #ffffff;
  border-top: 1px solid #ccc;
}

/* ===== INPUT ===== */
input {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border-radius: 25px;
  border: 1px solid #ccc;
  outline: none;
}

input::placeholder {
  color: #999;
}

/* ===== SEND BUTTON ===== */
button {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: #bdbdbd;
  cursor: not-allowed;
  font-size: 20px;
  color: white;
}

button.active {
  background: linear-gradient(145deg, #5fbf00, #4ca800);
  cursor: pointer;
}

/* ===== SCROLLBAR ===== */
.chat-area::-webkit-scrollbar {
  width: 6px;
}
.chat-area::-webkit-scrollbar-thumb {
  background: #aaa;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chatArea"></div>

<footer>
  <input id="userInput" placeholder="Type your query..." />
  <button id="sendBtn">➤</button>
</footer>

<script>
const chat = document.getElementById("chatArea");
const input = document.getElementById("userInput");
const btn = document.getElementById("sendBtn");

/* ===== ENABLE BUTTON ===== */
input.addEventListener("input", () => {
  if (input.value.trim()) {
    btn.classList.add("active");
    btn.disabled = false;
  } else {
    btn.classList.remove("active");
    btn.disabled = true;
  }
});

/* ===== ENTER KEY ===== */
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && input.value.trim()) sendMessage();
});

btn.onclick = sendMessage;

/* ===== TIME ===== */
function timeNow() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ===== ADD MESSAGE ===== */
function addMessage(text, type, cls="") {
  const msg = document.createElement("div");
  msg.className = `message ${type} ${cls}`;
  msg.innerHTML = text.replace(/\b([A-Z]{2,}[-_]\d+)\b/g, `<span class="code">$1</span>`);
  const t = document.createElement("div");
  t.className = "timestamp";
  t.innerText = timeNow();
  msg.appendChild(t);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

/* ===== INITIAL WELCOME (BOTTOM) ===== */
addMessage(
  "Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>How may I help you?",
  "ai"
);

/* ===== SEND MESSAGE ===== */
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  btn.classList.remove("active");
  btn.disabled = true;

  const thinking = addMessage("NIDAAN AI is thinking...", "ai", "thinking");

  setTimeout(() => {
    thinking.remove();
    const typing = addMessage("NIDAAN AI is typing...", "ai", "typing");

    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {
      typing.remove();
      addMessage(data.reply || "No reply from AI", "ai");
    })
    .catch(() => {
      typing.remove();
      addMessage("Error connecting to NIDAAN AI", "ai");
    });
  }, 600);
}
</script>

</body>
</html>
