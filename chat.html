<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #0a1f44, #1e3a8a, #274caa);
}

/* ================= HEADER ================= */
header {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 100;
  padding: 20px;
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #fff;
  background: rgba(10, 31, 68, 0.65);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

#darkToggle {
  position: absolute;
  right: 18px;
  top: 16px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 20px;
  background: rgba(255,255,255,0.25);
  color: #fff;
}

/* ================= CHAT ================= */
.chat-area {
  position: absolute;
  top: 90px;
  bottom: 88px;
  left: 0;
  right: 0;
  padding: 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* GLASS MESSAGE BASE */
.message {
  padding: 16px 20px;
  border-radius: 18px;
  max-width: 75%;
  font-size: 16px;
  line-height: 1.6;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

/* USER – ROYAL BLUE GLASS */
.user {
  align-self: flex-end;
  color: #fff;
  background: linear-gradient(
    135deg,
    rgba(59,130,246,0.9),
    rgba(30,64,175,0.9)
  );
}

/* AI – GLASS WHITE */
.ai {
  align-self: flex-start;
  color: #0f172a;
  background: rgba(255,255,255,0.85);
  border-left: 5px solid #2563eb;
}

.thinking {
  background: rgba(219,234,254,0.85);
  font-weight: 600;
}
.typing {
  background: rgba(224,231,255,0.85);
  font-weight: 600;
}

.dots::after {
  content: '';
  display: inline-block;
  width: 1.2em;
  animation: dots 1.4s steps(3,end) infinite;
}
@keyframes dots {
  0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...';}
}

.time {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* ================= FOOTER ================= */
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 14px;
  display: flex;
  gap: 10px;
  background: rgba(10,31,68,0.6);
  backdrop-filter: blur(14px);
  border-top: 1px solid rgba(255,255,255,0.2);
}

input {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.85);
}

/* BUTTONS */
button {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: #fff;
}

#micBtn {
  background: linear-gradient(135deg, #1e40af, #0a1f44);
  color: #fff;
}
#micBtn.listening {
  background: linear-gradient(135deg, #dc2626, #991b1b);
}

/* ================= DARK MODE ================= */
body.dark {
  background: linear-gradient(135deg, #020617, #020617);
}
body.dark .ai {
  background: rgba(2,6,23,0.85);
  color: #e5e7eb;
  border-left-color: #3b82f6;
}
body.dark input {
  background: rgba(2,6,23,0.9);
  color: #fff;
}
</style>
</head>

<body>

<header>
  NIDAAN AI
  <button id="darkToggle">🌙</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<script>
const input = document.getElementById("userInput");
const chat = document.getElementById("chatArea");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const darkToggle = document.getElementById("darkToggle");

darkToggle.onclick = () => {
  document.body.classList.toggle("dark");
  darkToggle.textContent =
    document.body.classList.contains("dark") ? "☀" : "🌙";
};

function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

let recognition = null;
if (window.SpeechRecognition || window.webkitSpeechRecognition) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
  };
  recognition.onend = () => micBtn.classList.remove("listening");
}

micBtn.onclick = () => {
  if (!recognition) return;
  micBtn.classList.add("listening");
  recognition.start();
};

sendBtn.onclick = sendMessage;

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerHTML = `${text}<div class="time">${now()}</div>`;
  chat.appendChild(user);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const thinking = document.createElement("div");
  thinking.className = "message ai thinking";
  thinking.innerHTML = `NIDAAN AI is thinking<span class="dots"></span>`;
  chat.appendChild(thinking);

  setTimeout(() => {
    thinking.remove();
    const typing = document.createElement("div");
    typing.className = "message ai typing";
    typing.innerHTML = `NIDAAN AI is typing<span class="dots"></span>`;
    chat.appendChild(typing);

    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text })
    })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      const ai = document.createElement("div");
      ai.className = "message ai";
      ai.innerHTML = `${d.reply}<div class="time">${now()}</div>`;
      chat.appendChild(ai);
      chat.scrollTop = chat.scrollHeight;
    });
  }, 900);
}
</script>

</body>
</html>
