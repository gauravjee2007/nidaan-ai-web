<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  height: 100vh;
  overflow: hidden;
}

/* ================= HEADER (LOGIN PAGE STYLE) ================= */
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: #fff;
  text-align: center;
  padding: 20px;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
}

#darkToggle {
  position: absolute;
  right: 18px;
  top: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 18px;
  background: rgba(255,255,255,0.15);
  color: #fff;
}

/* ================= CHAT ================= */
.chat-area {
  position: absolute;
  top: 90px;
  bottom: 82px;
  left: 0;
  right: 0;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.message {
  padding: 14px 18px;
  border-radius: 14px;
  max-width: 75%;
  font-size: 16px;
  line-height: 1.6;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}

/* USER – LIGHT BLUE (AS REQUESTED) */
.user {
  align-self: flex-end;
  background: #9ec5fe;
  color: #0b2545;
}

/* AI – CLEAN WHITE */
.ai {
  align-self: flex-start;
  background: #ffffff;
  color: #111;
}

/* THINKING / TYPING */
.thinking { background: #e6f4ea; font-weight: 500; }
.typing { background: #eef2ff; font-weight: 500; }

.dots::after {
  content: '';
  display: inline-block;
  width: 1.2em;
  animation: dots 1.4s steps(3,end) infinite;
}
@keyframes dots {
  0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...';}
}

.time {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* ================= FOOTER ================= */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #ffffff;
  border-top: 1px solid #dcdcdc;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #bbb;
}

button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: #fff;
}

#micBtn {
  background: linear-gradient(135deg, #64748b, #334155);
  color: #fff;
}
#micBtn.listening {
  background: linear-gradient(135deg, #dc2626, #991b1b);
}

/* DARK MODE */
body.dark { background: #0f172a; }
body.dark footer { background: #020617; }
body.dark input { background: #1e293b; color: #fff; }
body.dark .ai { background: #020617; color: #e5e7eb; }
</style>
</head>

<body>

<header>
  NIDAAN AI
  <button id="darkToggle">🌙</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<!-- 🔴 JS EXACT SAME – NO CHANGE -->
<script>
const input = document.getElementById("userInput");
const chat = document.getElementById("chatArea");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const darkToggle = document.getElementById("darkToggle");

darkToggle.onclick = () => {
  document.body.classList.toggle("dark");
  darkToggle.textContent = document.body.classList.contains("dark") ? "☀" : "🌙";
};

function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});

let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
  };
  recognition.onend = () => micBtn.classList.remove("listening");
}

micBtn.onclick = () => {
  if (!recognition) return;
  micBtn.classList.add("listening");
  recognition.start();
};

sendBtn.onclick = sendMessage;

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
