<!DOCTYPE html>
<html>
<head>
  <title>NIDAAN AI – Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ================= HEADER ================= */
    header {
      background: linear-gradient(120deg, #0a2a43, #133e7c, #0a2a43);
      background-size: 200% 200%;
      animation: shine 6s ease infinite;
      color: white;
      padding: 22px;
      text-align: center;
      font-weight: bold;
      font-size: 2.2rem; /* 2x size */
      letter-spacing: 1px;
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= CHAT AREA ================= */
    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      max-width: 80%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      word-wrap: break-word;
      font-size: 15px;
    }

    /* USER MESSAGE – LUCARATIVE GREEN */
    .message.user {
      background: linear-gradient(135deg, #00c853, #64dd17);
      color: #ffffff;
      align-self: flex-end;
      font-weight: 500;
      border-radius: 14px 14px 2px 14px;
      box-shadow: 0 4px 10px rgba(0,200,83,0.35);
    }

    /* AI MESSAGE */
    .message.ai {
      background: #ffffff;
      color: #1f2937;
      align-self: flex-start;
      border-radius: 14px 14px 14px 2px;
    }

    /* ================= FLOATING TYPING ================= */
    #typing-indicator {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2979ff, #00b0ff);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(41,121,255,0.45);
      animation: pulse 1.4s infinite;
      z-index: 999;
      display: none;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* ================= FOOTER ================= */
    footer {
      padding: 10px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #0a2a43;
      color: white;
      border: none;
      border-radius: 6px;
    }

    button:hover {
      background: #133e7c;
    }
  </style>
</head>

<body>

  <header>NIDAAN AI</header>

  <div class="chat-area" id="chatArea">
    <div class="message ai">
      Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
      How may I help you?
    </div>
  </div>

  <!-- FLOATING TYPING -->
  <div id="typing-indicator">NIDAAN AI is typing…</div>

  <footer>
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chatArea");
    const typingIndicator = document.getElementById("typing-indicator");

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;

      // USER MESSAGE
      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.innerText = text;
      chat.appendChild(userMsg);

      input.value = "";
      scrollToBottom();

      // SHOW TYPING
      typingIndicator.style.display = "block";

      fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      })
      .then(res => res.json())
      .then(data => {
        typingIndicator.style.display = "none";

        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai";
        aiMsg.innerText = data.reply || "No reply from AI";
        chat.appendChild(aiMsg);
        scrollToBottom();
      })
      .catch(() => {
        typingIndicator.style.display = "none";

        const errMsg = document.createElement("div");
        errMsg.className = "message ai";
        errMsg.innerText = "Error connecting to NIDAAN AI";
        chat.appendChild(errMsg);
        scrollToBottom();
      });
    }
  </script>

</body>
</html>
