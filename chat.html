<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f3f5;
  height: 100vh;
  overflow: hidden; /* 🔧 FIX */
}

/* ================= HEADER ================= */
header {
  position: fixed; /* 🔧 FIX */
  top: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  background: linear-gradient(
    90deg,
    #0b1e2d 0%,
    #1f3f5a 25%,
    #3a6f9a 55%,
    #6fa8dc 100%
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -2px 4px rgba(0,0,0,0.4),
    0 4px 10px rgba(0,0,0,0.25);
  color: #fff;
  text-align: center;
  padding: 22px;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* DARK MODE TOGGLE */
#darkToggle {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 20px;
  background: rgba(255,255,255,0.2);
  color: #fff;
}

/* ================= CHAT ================= */
.chat-area {
  position: absolute; /* 🔧 FIX */
  top: 96px;          /* 🔧 header height */
  bottom: 84px;       /* 🔧 footer height */
  left: 0;
  right: 0;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* MESSAGE */
.message {
  padding: 12px 16px;
  border-radius: 14px;
  max-width: 78%;
  font-size: 17px;
  line-height: 1.45;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* USER */
.user {
  align-self: flex-end;
  background: #228B22;
  color: #ffffff;
}

/* AI */
.ai {
  align-self: flex-start;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(10px);
  color: #000;
}

.thinking {
  background: rgba(160, 220, 160, 0.95);
  font-weight: bold;
}

.typing {
  background: rgba(170, 190, 230, 0.95);
  font-weight: bold;
}

.dots::after {
  content: '';
  display: inline-block;
  width: 1.2em;
  animation: dots 1.4s steps(3, end) infinite;
}

@keyframes dots {
  0% {content:'';}
  33% {content:'.';}
  66% {content:'..';}
  100% {content:'...';}
}

.time {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* ================= FOOTER ================= */
footer {
  position: fixed; /* 🔧 FIX */
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #ffffff;
  border-top: 1px solid #ccc;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 17px;
  border-radius: 10px;
  border: 1px solid #bbb;
  outline: none;
}

button {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
  color: #fff;
}

#micBtn {
  background: linear-gradient(135deg, #555, #333);
  color: white;
}

#micBtn.listening {
  background: linear-gradient(135deg, #e53935, #b71c1c);
}

/* DARK MODE */
body.dark {
  background: #121212;
}
body.dark footer {
  background: #1e1e1e;
}
body.dark input {
  background: #2a2a2a;
  color: #fff;
}
body.dark .ai {
  background: rgba(40,40,40,0.9);
  color: #f1f1f1;
}
body.dark .thinking {
  background: rgba(90,130,90,0.95);
}
body.dark .typing {
  background: rgba(80,100,140,0.95);
}
</style>
</head>

<body>

<header>
  NIDAAN AI
  <button id="darkToggle">🌙</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<!-- 🔁 JS SAME AS YOUR CODE (UNCHANGED) -->
<script>
/* JS EXACTLY SAME – NO CHANGE */
</script>

</body>
</html>
