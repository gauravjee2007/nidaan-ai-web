<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – SS Rig Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --metal-blue: linear-gradient(135deg,#0a2a43,#1e4d6b,#0a2a43);
  --metal-green: linear-gradient(135deg,#4caf50,#6fdc6f,#3e9142);
  --metal-grey: linear-gradient(135deg,#9e9e9e,#cfcfcf);
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f4f6f8;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  background:var(--metal-blue);
  color:#fff;
  padding:22px;
  text-align:center;
  font-size:32px;
  font-weight:800;
  letter-spacing:2px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}

/* CHAT AREA */
.chat-area{
  flex:1;
  padding:16px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

/* MESSAGE COMMON */
.message{
  max-width:78%;
  padding:12px 14px;
  margin-bottom:14px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
  line-height:1.45;
  word-wrap:break-word;
}

.ai{
  background:#fff;
  align-self:flex-start;
}

.user{
  background:var(--metal-green);
  color:#fff;
  align-self:flex-end;
}

.time{
  font-size:11px;
  opacity:.6;
  margin-top:4px;
  text-align:right;
}

/* THINKING / TYPING */
.status{
  font-style:italic;
  color:#4caf50;
  background:#eef8ee;
}

/* FOOTER */
footer{
  display:flex;
  gap:10px;
  padding:12px;
  border-top:1px solid #ccc;
  background:#fff;
}

input{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:52px;
  border:none;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
  background:var(--metal-grey);
  color:#333;
  transition:.3s;
}

button.active{
  background:var(--metal-green);
  color:#fff;
}

/* ALARM / CODE HIGHLIGHT */
.highlight{
  color:#d32f2f;
  font-weight:700;
}
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chat">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time" id="startTime"></div>
  </div>
</div>

<footer>
  <input id="input" placeholder="Type your query..." />
  <button id="sendBtn" disabled>➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const btn = document.getElementById("sendBtn");

document.getElementById("startTime").innerText = timeNow();

/* ENABLE SEND */
input.addEventListener("input",()=>{
  if(input.value.trim()){
    btn.classList.add("active");
    btn.disabled=false;
  }else{
    btn.classList.remove("active");
    btn.disabled=true;
  }
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !btn.disabled) send();
});

btn.onclick = send;

function send(){
  const text=input.value.trim();
  if(!text) return;

  addMsg(text,"user");
  input.value="";
  btn.disabled=true;
  btn.classList.remove("active");

  const thinking = addStatus("NIDAAN AI is thinking…");
  setTimeout(()=>{
    thinking.remove();
    const typing = addStatus("NIDAAN AI is typing…");
    
    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({message:text})
    })
    .then(r=>r.json())
    .then(d=>{
      typing.remove();
      addMsg(highlight(d.reply || "No reply from AI"),"ai");
    })
    .catch(()=>{
      typing.remove();
      addMsg("Error connecting to NIDAAN AI","ai");
    });
  },500);
}

function addMsg(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerHTML=text+`<div class="time">${timeNow()}</div>`;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function addStatus(text){
  const div=document.createElement("div");
  div.className="message ai status";
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}

function timeNow(){
  const d=new Date();
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function highlight(text){
  return text.replace(/(\b[A-Z]{1,3}-?\d+\b|\b\d{4,}\b)/g,
    '<span class="highlight">$1</span>');
}
</script>

</body>
</html>
