<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0b2a44, #1f3b57);
    color: white;
    text-align: center;
    padding: 22px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  /* CHAT AREA */
  .chat-area {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* COMMON MESSAGE */
  .message {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 75%;
    font-size: 17px;
    line-height: 1.45;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  /* USER MESSAGE (RIGHT – WHATSAPP STYLE) */
  .user {
    align-self: flex-end;
    background: #5aa357;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* AI MESSAGE (LEFT) */
  .ai {
    align-self: flex-start;
    background: #ffffff;
    color: #000;
    border-bottom-left-radius: 4px;
  }

  /* THINKING (LIGHT GREEN – DIFFERENT) */
  .thinking {
    background: #d9f0d9;
    font-weight: bold;
    color: #000;
  }

  /* TYPING (LIGHT BLUE – DIFFERENT) */
  .typing {
    background: #dbeaf7;
    font-weight: bold;
    color: #000;
  }

  /* FOOTER */
  footer {
    padding: 12px;
    display: flex;
    gap: 10px;
    background: #ffffff;
    border-top: 1px solid #ccc;
  }

  input {
    flex: 1;
    padding: 14px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid #bbb;
    outline: none;
  }

  /* SEND BUTTON */
  button {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
    color: white;
    font-size: 20px;
    cursor: pointer;
    opacity: 0.4;
  }

  button.active {
    opacity: 1;
  }
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="sendBtn">➤</button>
</footer>

<script>
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chatArea");
  const sendBtn = document.getElementById("sendBtn");

  input.addEventListener("input", () => {
    sendBtn.classList.toggle("active", input.value.trim().length > 0);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  sendBtn.addEventListener("click", sendMessage);

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerText = text;
    chat.appendChild(userMsg);

    input.value = "";
    sendBtn.classList.remove("active");
    scrollDown();

    const thinking = document.createElement("div");
    thinking.className = "message ai thinking";
    thinking.innerText = "NIDAAN AI is thinking...";
    chat.appendChild(thinking);
    scrollDown();

    setTimeout(() => {
      thinking.remove();

      const typing = document.createElement("div");
      typing.className = "message ai typing";
      typing.innerText = "NIDAAN AI is typing...";
      chat.appendChild(typing);
      scrollDown();

      fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      })
      .then(res => res.json())
      .then(data => {
        typing.remove();
        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai";
        aiMsg.innerText = data.reply || "No reply from AI";
        chat.appendChild(aiMsg);
        scrollDown();
      })
      .catch(() => {
        typing.remove();
        const err = document.createElement("div");
        err.className = "message ai";
        err.innerText = "Error connecting to NIDAAN AI";
        chat.appendChild(err);
        scrollDown();
      });

    }, 500);
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
