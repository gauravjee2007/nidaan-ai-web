<!DOCTYPE html>
<html>
<head>
  <title>NIDAAN AI – Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ================= HEADER ================= */
    header {
      background: linear-gradient(135deg, #0a2a43, #1e4fa3, #0a2a43);
      background-size: 300% 300%;
      animation: shine 7s ease infinite;
      color: white;
      padding: 24px;
      text-align: center;
      font-weight: bold;
      font-size: 2.3rem;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= CHAT AREA ================= */
    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.45;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .timestamp {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    /* USER MESSAGE */
    .user {
      background: linear-gradient(135deg, #00c853, #64dd17);
      color: white;
      align-self: flex-end;
      box-shadow: 0 5px 14px rgba(0,200,83,0.45);
    }

    /* AI MESSAGE */
    .ai {
      background: linear-gradient(145deg, #ffffff, #eef2f7);
      color: #1f2937;
      align-self: flex-start;
    }

    /* ================= FLOATING STATUS ================= */
    .status {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      display: none;
      z-index: 999;
      color: white;
    }

    #thinking {
      background: linear-gradient(135deg, #ff9800, #ffb300);
    }

    #typing {
      background: linear-gradient(135deg, #2979ff, #00b0ff);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* ================= FOOTER ================= */
    footer {
      padding: 10px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(135deg, #00c853, #64dd17);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    /* ================= ALARM HIGHLIGHT ================= */
    .alarm { color: #d32f2f; font-weight: bold; }
    .warning { color: #f57c00; font-weight: bold; }
    .ok { color: #2e7d32; font-weight: bold; }
  </style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chat">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.
    <div class="timestamp">--:--</div>
  </div>
</div>

<div id="thinking" class="status">NIDAAN AI is thinking…</div>
<div id="typing" class="status">NIDAAN AI is typing…</div>

<footer>
  <input id="input" placeholder="Type your message...">
  <button onclick="send()">Send</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const thinking = document.getElementById("thinking");
const typing = document.getElementById("typing");

input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

function timeNow() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function highlight(text) {
  return text
    .replace(/(ALARM|FAULT|TRIP)/gi, '<span class="alarm">$1</span>')
    .replace(/(WARN|WARNING)/gi, '<span class="warning">$1</span>')
    .replace(/(OK|NORMAL)/gi, '<span class="ok">$1</span>');
}

function send() {
  const text = input.value.trim();
  if (!text) return;

  const u = document.createElement("div");
  u.className = "message user";
  u.innerHTML = text + `<div class="timestamp">${timeNow()}</div>`;
  chat.appendChild(u);
  chat.scrollTop = chat.scrollHeight;
  input.value = "";

  thinking.style.display = "block";

  fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  })
  .then(r => r.json())
  .then(d => {
    thinking.style.display = "none";
    typing.style.display = "block";

    setTimeout(() => {
      typing.style.display = "none";

      const a = document.createElement("div");
      a.className = "message ai";
      a.innerHTML = highlight(d.reply || "No reply from AI") +
        `<div class="timestamp">${timeNow()}</div>`;
      chat.appendChild(a);
      chat.scrollTop = chat.scrollHeight;
    }, 700);
  })
  .catch(() => {
    thinking.style.display = "none";
    typing.style.display = "none";

    const e = document.createElement("div");
    e.className = "message ai";
    e.innerText = "Error connecting to NIDAAN AI";
    chat.appendChild(e);
  });
}
</script>

</body>
</html>
