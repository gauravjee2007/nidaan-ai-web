<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  * {
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0b2a44, #1f3b57);
    color: white;
    text-align: center;
    padding: 22px;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  /* CHAT AREA */
  .chat-area {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* MESSAGE COMMON */
  .message {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 80%;
    font-size: 17px;
    line-height: 1.45;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: relative;
  }

  /* TIMESTAMP */
  .time {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 6px;
    text-align: right;
  }

  /* USER MESSAGE */
  .user {
    align-self: flex-end;
    background: linear-gradient(135deg, #4caf50, #2e7d32); /* dark lime */
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  /* AI MESSAGE – GLASSY METALLIC */
  .ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #000;
    border: 1px solid rgba(255,255,255,0.35);
    border-bottom-left-radius: 4px;
  }

  /* THINKING */
  .thinking {
    background: rgba(170, 215, 170, 0.6);
    font-weight: bold;
  }

  /* TYPING */
  .typing {
    background: rgba(180, 200, 230, 0.6);
    font-weight: bold;
  }

  /* DOT ANIMATION */
  .dots::after {
    content: "";
    animation: dots 1.5s infinite;
  }

  @keyframes dots {
    0% { content: ""; }
    33% { content: "."; }
    66% { content: ".."; }
    100% { content: "..."; }
  }

  /* FOOTER */
  footer {
    padding: 12px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    gap: 8px;
    background: #ffffff;
    border-top: 1px solid #ccc;
  }

  input {
    flex: 1;
    padding: 14px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid #bbb;
    outline: none;
  }

  /* SEND BUTTON */
  button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
    color: white;
    opacity: 0.5;
  }

  button.active {
    opacity: 1;
  }

  /* MIC BUTTON */
  .mic {
    background: linear-gradient(135deg, #444, #222);
  }

  .mic.listening {
    background: linear-gradient(135deg, #e53935, #b71c1c);
    opacity: 1;
  }

  @media (max-width: 600px) {
    header {
      font-size: 28px;
      padding: 18px;
    }
    .message {
      font-size: 16px;
      max-width: 90%;
    }
  }
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn" class="mic">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<script>
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chatArea");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");

  function timeNow() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  let recognition;
  if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = "en-IN";
    recognition.onresult = e => {
      input.value = e.results[0][0].transcript;
      sendBtn.classList.add("active");
    };
    recognition.onend = () => micBtn.classList.remove("listening");
  } else {
    micBtn.style.display = "none";
  }

  micBtn.onclick = () => {
    micBtn.classList.add("listening");
    recognition.start();
  };

  input.oninput = () => sendBtn.classList.toggle("active", input.value.trim());
  input.onkeydown = e => e.key === "Enter" && sendMessage();
  sendBtn.onclick = sendMessage;

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerHTML = `${text}<div class="time">${timeNow()}</div>`;
    chat.appendChild(userMsg);

    input.value = "";
    sendBtn.classList.remove("active");
    scrollDown();

    const thinking = document.createElement("div");
    thinking.className = "message ai thinking dots";
    thinking.innerText = "NIDAAN AI is thinking";
    chat.appendChild(thinking);
    scrollDown();

    setTimeout(() => {
      thinking.remove();

      const typing = document.createElement("div");
      typing.className = "message ai typing dots";
      typing.innerText = "NIDAAN AI is typing";
      chat.appendChild(typing);
      scrollDown();

      fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      })
      .then(r => r.json())
      .then(d => {
        typing.remove();
        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai";
        aiMsg.innerHTML = `${d.reply || "No reply from AI"}<div class="time">${timeNow()}</div>`;
        chat.appendChild(aiMsg);
        scrollDown();
      })
      .catch(() => {
        typing.remove();
        const err = document.createElement("div");
        err.className = "message ai";
        err.innerHTML = `Error connecting to NIDAAN AI<div class="time">${timeNow()}</div>`;
        chat.appendChild(err);
        scrollDown();
      });
    }, 1200); // thinking time increased
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
