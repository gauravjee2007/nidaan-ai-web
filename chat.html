<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER – GLASSY METALLIC */
header {
  background: linear-gradient(
    to bottom,
    #0a2236 0%,
    #143a5a 40%,
    #2f5f8f 100%
  );
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2),
              inset 0 -1px 0 rgba(0,0,0,0.3);
  color: white;
  text-align: center;
  padding: 22px;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* CHAT */
.chat-area {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  padding: 12px 16px;
  border-radius: 12px;
  max-width: 80%;
  font-size: 17px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.user {
  align-self: flex-end;
  background: #5aa356;
  color: #fff;
}

.ai {
  align-self: flex-start;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  color: #000;
}

.thinking {
  background: rgba(170,210,170,0.9);
  font-weight: bold;
}

.typing {
  background: rgba(170,190,230,0.9);
  font-weight: bold;
}

.time {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* FOOTER */
footer {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #ccc;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 17px;
  border-radius: 10px;
  border: 1px solid #bbb;
  outline: none;
}

button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
  color: white;
}

#micBtn {
  background: linear-gradient(135deg, #555, #333);
  color: white;
}

#micBtn.listening {
  background: linear-gradient(135deg, #e53935, #b71c1c);
}

#voiceToggle {
  background: linear-gradient(135deg, #777, #444);
  color: white;
}
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="voiceToggle">🔇</button>
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<script>
const input = document.getElementById("userInput");
const chat = document.getElementById("chatArea");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const voiceToggle = document.getElementById("voiceToggle");

let voiceEnabled = false;

/* TOGGLE VOICE */
voiceToggle.onclick = () => {
  voiceEnabled = !voiceEnabled;
  voiceToggle.textContent = voiceEnabled ? "🔈" : "🔇";
};

/* TIME */
function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ENTER SEND */
input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* VOICE INPUT */
let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.focus();
  };
  recognition.onend = () => micBtn.classList.remove("listening");
}

micBtn.onclick = () => {
  if (!recognition) return;
  micBtn.classList.add("listening");
  recognition.start();
};

/* LANGUAGE DETECT */
function detectLang(text) {
  return /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-IN";
}

/* MALE VOICE FORCE */
function speakAI(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;

  const lang = detectLang(text);
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = lang;
  msg.rate = 0.9;
  msg.pitch = 0.6;

  const voices = speechSynthesis.getVoices();
  let male = voices.find(v =>
    v.lang.startsWith(lang) &&
    /male|man|deep|ravi|arjun/i.test(v.name)
  );

  if (!male) {
    male = voices.find(v => /male|man|english/i.test(v.name));
  }

  if (male) msg.voice = male;

  speechSynthesis.speak(msg);
}

/* SEND MESSAGE */
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerHTML = `${text}<div class="time">${now()}</div>`;
  chat.appendChild(user);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const thinking = document.createElement("div");
  thinking.className = "message ai thinking";
  thinking.textContent = "NIDAAN AI is thinking...";
  chat.appendChild(thinking);

  setTimeout(() => {
    thinking.remove();

    const typing = document.createElement("div");
    typing.className = "message ai typing";
    typing.textContent = "NIDAAN AI is typing...";
    chat.appendChild(typing);

    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      const ai = document.createElement("div");
      ai.className = "message ai";
      ai.innerHTML = `${d.reply}<div class="time">${now()}</div>`;
      chat.appendChild(ai);
      chat.scrollTop = chat.scrollHeight;
      speakAI(d.reply);
    });
  }, 1500);
}
</script>

</body>
</html>
