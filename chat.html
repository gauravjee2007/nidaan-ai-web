<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: Calibri, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(180deg,#2c3e50,#1b2b3a);
  color: #fff;
  padding: 22px;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ===== MESSAGE COMMON ===== */
.message {
  max-width: 78%;
  padding: 14px 16px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  font-size: 16px;
  line-height: 1.5;
  position: relative;
}

/* ===== USER ===== */
.user {
  align-self: flex-end;
  background: #5fae4e;
  color: #fff;
}

/* ===== AI ===== */
.ai {
  align-self: flex-start;
  background: #ffffff;
  color: #000;
}

/* ===== TIMESTAMP ===== */
.time {
  font-size: 11px;
  opacity: .6;
  margin-top: 6px;
  text-align: right;
}

/* ===== THINKING / TYPING ===== */
.thinking {
  background: #e4f6ea;
  font-weight: bold;
  color: #000;
}

.typing {
  background: #e9eef3;
  font-weight: bold;
  color: #000;
}

/* ===== INPUT AREA ===== */
footer {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: #ffffff;
  border-top: 1px solid #ccc;
}

input {
  flex: 1;
  padding: 12px 14px;
  font-size: 16px;
  border-radius: 22px;
  border: 1px solid #bbb;
}

/* ===== SEND BUTTON ===== */
button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(180deg,#3c6fa3,#2b4f73);
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:disabled {
  background: #b5b5b5;
  cursor: not-allowed;
}

/* ===== MIC ===== */
.mic {
  background: #e0e0e0;
  color: #000;
}

/* ===== HIGHLIGHT ALARMS ===== */
.highlight {
  color: #c0392b;
  font-weight: bold;
}
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chat"></div>

<footer>
  <input id="input" placeholder="Type your query..." />
  <button class="mic" onclick="startVoice()">🎤</button>
  <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

/* ===== LOGIN ===== */
if (!localStorage.getItem("nidaanUser")) {
  const u = prompt("Enter User ID:");
  localStorage.setItem("nidaanUser", u || "Guest");
}

/* ===== ENABLE SEND ===== */
input.addEventListener("input", () => {
  sendBtn.disabled = input.value.trim() === "";
});

/* ===== WELCOME (BOTTOM) ===== */
addAI("Hello 👋 I’m NIDAAN AI — your intelligent SS Rig assistant.<br>How may I help you?");

/* ===== SEND MESSAGE ===== */
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addUser(text);
  input.value = "";
  sendBtn.disabled = true;

  const thinking = addStatus("NIDAAN AI is thinking...", "thinking");

  fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message: text })
  })
  .then(r => r.json())
  .then(d => {
    thinking.remove();
    const typing = addStatus("NIDAAN AI is typing...", "typing");
    setTimeout(()=>{
      typing.remove();
      addAI(formatText(d.reply || "No reply from AI"));
    },600);
  })
  .catch(()=>{
    thinking.remove();
    addAI("Error connecting to NIDAAN AI");
  });
}

/* ===== HELPERS ===== */
function addUser(t){
  const d=document.createElement("div");
  d.className="message user";
  d.innerHTML=t;
  d.appendChild(time());
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function addAI(t){
  const d=document.createElement("div");
  d.className="message ai";
  d.innerHTML=t;
  d.appendChild(time());
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function addStatus(t,c){
  const d=document.createElement("div");
  d.className="message "+c;
  d.innerText=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

function time(){
  const s=document.createElement("div");
  s.className="time";
  s.innerText=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return s;
}

/* ===== ALARM HIGHLIGHT ===== */
function formatText(t){
  return t.replace(/\b(ALM|ESD|TRIP|FAULT)\b/g,
    '<span class="highlight">$1</span>');
}

/* ===== VOICE INPUT ===== */
function startVoice(){
  const r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  r.lang="en-IN";
  r.onresult=e=>{input.value=e.results[0][0].transcript; sendBtn.disabled=false;}
  r.start();
}
</script>

</body>
</html>
