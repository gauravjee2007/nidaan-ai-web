<!DOCTYPE html>
<html>
<head>
  <title>NIDAAN AI – Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #0a2a43;
      color: white;
      padding: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      word-wrap: break-word;
    }

    .message.user {
      background: #dcf8c6;
      align-self: flex-end;
    }

    .message.ai {
      background: #ffffff;
      align-self: flex-start;
    }

    footer {
      padding: 10px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>NIDAAN AI</header>

  <div class="chat-area" id="chatArea">
    <div class="message ai">
      Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
      How may I help you?
    </div>
  </div>

  <footer>
    <input type="text" id="userInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chatArea");

    // ENTER key support
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;

      // USER MESSAGE
      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.innerText = text;
      chat.appendChild(userMsg);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      // TYPING INDICATOR
      const typing = document.createElement("div");
      typing.className = "message ai";
      typing.innerText = "NIDAAN AI is typing...";
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      // FAKE AI RESPONSE
      fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook-test/nidaan-chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    message: text
  })
})
.then(res => res.json())
.then(data => {
  typing.remove();

  const aiMsg = document.createElement("div");
  aiMsg.className = "message ai";
  aiMsg.innerText = data.reply || "No reply from AI";
  chat.appendChild(aiMsg);
  chat.scrollTop = chat.scrollHeight;
})
.catch(err => {
  typing.remove();

  const errMsg = document.createElement("div");
  errMsg.className = "message ai";
  errMsg.innerText = "Error connecting to NIDAAN AI";
  chat.appendChild(errMsg);
});

    }
  </script>

</body>
</html>
