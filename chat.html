<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f1f3f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.3s;
}

/* ================= HEADER ================= */
header {
  position: relative;
  background: linear-gradient(
    90deg,
    #0b1e2d 0%,
    #1f3f5a 25%,
    #3a6f9a 55%,
    #6fa8dc 100%
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -2px 4px rgba(0,0,0,0.4),
    0 4px 10px rgba(0,0,0,0.25);
  color: #fff;
  text-align: center;
  padding: 22px;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* 🌙 DARK MODE TOGGLE */
#darkToggle {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 20px;
  background: rgba(255,255,255,0.2);
  color: #fff;
}

/* ================= CHAT ================= */
.chat-area {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: background 0.3s;
}

.message {
  padding: 12px 16px;
  border-radius: 14px;
  max-width: 78%;
  font-size: 17px;
  line-height: 1.45;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* USER – Forest Green (unchanged) */
.user {
  align-self: flex-end;
  background: #228B22;
  color: #ffffff;
}

/* AI – Light */
.ai {
  align-self: flex-start;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(10px);
  color: #000;
}

/* THINKING / TYPING */
.thinking {
  background: rgba(160, 220, 160, 0.95);
  font-weight: bold;
}

.typing {
  background: rgba(170, 190, 230, 0.95);
  font-weight: bold;
}

/* TIME */
.time {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* ================= FOOTER ================= */
footer {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #ffffff;
  border-top: 1px solid #ccc;
  transition: background 0.3s;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 17px;
  border-radius: 10px;
  border: 1px solid #bbb;
  outline: none;
}

button {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
  color: #fff;
}

#micBtn {
  background: linear-gradient(135deg, #555, #333);
  color: white;
}

#micBtn.listening {
  background: linear-gradient(135deg, #e53935, #b71c1c);
}

/* ================= DARK MODE ================= */
body.dark {
  background: #121212;
}

body.dark .chat-area {
  background: #121212;
}

body.dark footer {
  background: #1e1e1e;
  border-top: 1px solid #333;
}

body.dark input {
  background: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
}

body.dark .ai {
  background: rgba(40,40,40,0.9);
  color: #f1f1f1;
}

body.dark .thinking {
  background: rgba(90,130,90,0.95);
}

body.dark .typing {
  background: rgba(80,100,140,0.95);
}
</style>
</head>

<body>

<header>
  NIDAAN AI
  <button id="darkToggle">🌙</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<script>
const input = document.getElementById("userInput");
const chat = document.getElementById("chatArea");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const darkToggle = document.getElementById("darkToggle");

/* ========== DARK MODE LOGIC ========== */
const savedMode = localStorage.getItem("darkMode");
if (savedMode === "on") {
  document.body.classList.add("dark");
  darkToggle.textContent = "☀";
}

darkToggle.onclick = () => {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  darkToggle.textContent = dark ? "☀" : "🌙";
  localStorage.setItem("darkMode", dark ? "on" : "off");
};

/* TIME */
function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ENTER SEND */
input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* VOICE INPUT ONLY */
let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.focus();
  };
  recognition.onend = () => micBtn.classList.remove("listening");
}

micBtn.onclick = () => {
  if (!recognition) return;
  micBtn.classList.add("listening");
  recognition.start();
};

sendBtn.onclick = () => sendMessage();

/* SEND MESSAGE */
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerHTML = `${text}<div class="time">${now()}</div>`;
  chat.appendChild(user);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const thinking = document.createElement("div");
  thinking.className = "message ai thinking";
  thinking.textContent = "NIDAAN AI is thinking...";
  chat.appendChild(thinking);

  setTimeout(() => {
    thinking.remove();

    const typing = document.createElement("div");
    typing.className = "message ai typing";
    typing.textContent = "NIDAAN AI is typing...";
    chat.appendChild(typing);

    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      const ai = document.createElement("div");
      ai.className = "message ai";
      ai.innerHTML = `${d.reply}<div class="time">${now()}</div>`;
      chat.appendChild(ai);
      chat.scrollTop = chat.scrollHeight;
    });
  }, 1500);
}
</script>

</body>
</html>
