<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family: system-ui, -apple-system, "Segoe UI",
               "Helvetica Neue", Arial, sans-serif;
}

body{
  margin:0;
  background:#eaf5f3;
  height:100vh;
  overflow:hidden;
}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0; left:0;
  width:100%;
  z-index:100;
  background:linear-gradient(135deg,#075e54,#128c7e);
  color:#fff;
  text-align:center;
  padding:18px;
  font-size:28px;
  font-weight:600;
  letter-spacing:1px;
}

#darkToggle{
  position:absolute;
  right:16px;
  top:14px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  font-size:18px;
  background:rgba(255,255,255,0.25);
  color:#fff;
}

/* ================= CHAT ================= */
.chat-area{
  position:absolute;
  top:82px;
  bottom:78px;
  left:0; right:0;
  padding:16px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  padding:12px 16px;
  border-radius:14px;
  max-width:78%;
  font-size:15.5px;
  line-height:1.5;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* USER – LIGHT TEAL */
.user{
  align-self:flex-end;
  background:#dcf8f1;
  color:#111;
}

/* AI – WHITE */
.ai{
  align-self:flex-start;
  background:#ffffff;
  color:#111;
}

/* THINKING / TYPING – LIGHT CONTRAST */
.thinking{
  background:#e1f5ec;
  font-weight:600;
}
.typing{
  background:#d0f0e6;
  font-weight:600;
}

.dots::after{
  content:'';
  display:inline-block;
  width:1.2em;
  animation:dots 1.4s steps(3,end) infinite;
}
@keyframes dots{
  0%{content:'';}
  33%{content:'.';}
  66%{content:'..';}
  100%{content:'...';}
}

.time{
  font-size:11px;
  opacity:0.6;
  margin-top:5px;
  text-align:right;
}

/* ================= FOOTER ================= */
footer{
  position:fixed;
  bottom:0; left:0;
  width:100%;
  z-index:100;
  display:flex;
  gap:10px;
  padding:10px;
  background:#f0fdfa;
  border-top:1px solid #b2dfdb;
}

input{
  flex:1;
  padding:12px 14px;
  font-size:15.5px;
  border-radius:22px;
  border:1px solid #9fd6c9;
  outline:none;
}

/* BUTTONS */
button{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
}

#sendBtn{
  background:#128c7e;
  color:#fff;
}

#micBtn{
  background:#075e54;
  color:#fff;
}
#micBtn.listening{
  background:#c62828;
}

/* ================= DARK MODE ================= */
body.dark{
  background:#0f2f2b;
}
body.dark footer{
  background:#0b3a34;
}
body.dark input{
  background:#134e4a;
  color:#fff;
  border-color:#2dd4bf;
}
body.dark .ai{
  background:#134e4a;
  color:#e6fffa;
}
body.dark .user{
  background:#2dd4bf;
  color:#022c22;
}
</style>
</head>

<body>

<header>
  NIDAAN AI
  <button id="darkToggle" type="button">🌙</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant. How may I help you today ?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." autocomplete="off">
  <button id="micBtn" type="button">🎙</button>
  <button id="sendBtn" type="button">➤</button>
</footer>

<script>
const input=document.getElementById("userInput");
const chat=document.getElementById("chatArea");
const sendBtn=document.getElementById("sendBtn");
const micBtn=document.getElementById("micBtn");
const darkToggle=document.getElementById("darkToggle");

/* DARK MODE */
darkToggle.onclick=()=>{
 document.body.classList.toggle("dark");
 darkToggle.textContent=document.body.classList.contains("dark")?"☀":"🌙";
};

/* TIME */
function now(){
 return new Date().toLocaleTimeString([],{
  hour:'2-digit',minute:'2-digit'
 });
}

/* ENTER KEY */
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  sendMessage();
 }
});

/* MIC */
let recognition=null;
if(window.SpeechRecognition||window.webkitSpeechRecognition){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 recognition=new SR();
 recognition.lang="en-IN";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
 };
 recognition.onend=()=>micBtn.classList.remove("listening");
}

micBtn.onclick=()=>{
 if(!recognition)return;
 micBtn.classList.add("listening");
 recognition.start();
};

/* SEND */
sendBtn.onclick=sendMessage;

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 const user=document.createElement("div");
 user.className="message user";
 user.innerHTML=`${text}<div class="time">${now()}</div>`;
 chat.appendChild(user);

 input.value="";
 chat.scrollTop=chat.scrollHeight;

 const thinking=document.createElement("div");
 thinking.className="message ai thinking";
 thinking.innerHTML=`NIDAAN AI is thinking<span class="dots"></span>`;
 chat.appendChild(thinking);

 setTimeout(()=>{
  thinking.remove();

  const typing=document.createElement("div");
  typing.className="message ai typing";
  typing.innerHTML=`NIDAAN AI is typing<span class="dots"></span>`;
  chat.appendChild(typing);

  fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  })
  .then(r=>r.json())
  .then(d=>{
   typing.remove();
   const ai=document.createElement("div");
   ai.className="message ai";
   ai.innerHTML=`${d.reply}<div class="time">${now()}</div>`;
   chat.appendChild(ai);
   chat.scrollTop=chat.scrollHeight;
  });
 },900);
}
</script>

</body>
</html>
