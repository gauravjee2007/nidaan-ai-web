<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIDAAN AI – Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #0b2a44, #1f3b57);
  color: white;
  text-align: center;
  padding: 22px;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* CHAT */
.chat-area {
  flex: 1;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  padding: 12px 16px;
  border-radius: 12px;
  max-width: 80%;
  font-size: 17px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #4caf50, #2e7d32);
  color: #fff;
}

.ai {
  align-self: flex-start;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  color: #000;
}

.thinking {
  background: rgba(160,210,160,0.7);
  font-weight: bold;
}

.typing {
  background: rgba(180,200,230,0.7);
  font-weight: bold;
}

.time {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
  text-align: right;
}

/* FOOTER */
footer {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #ccc;
}

input {
  flex: 1;
  padding: 14px;
  font-size: 17px;
  border-radius: 10px;
  border: 1px solid #bbb;
  outline: none;
}

button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn {
  background: linear-gradient(135deg, #2f6fa3, #1c4f7a);
  color: white;
}

#micBtn {
  background: linear-gradient(135deg, #555, #333);
  color: white;
}

#micBtn.listening {
  background: linear-gradient(135deg, #e53935, #b71c1c);
}
</style>
</head>

<body>

<header>NIDAAN AI</header>

<div class="chat-area" id="chatArea">
  <div class="message ai">
    Hello 👋 I’m <b>NIDAAN AI</b> — your intelligent SS Rig assistant.<br>
    How may I help you?
    <div class="time"></div>
  </div>
</div>

<footer>
  <input id="userInput" type="text" placeholder="Type your query..." />
  <button id="micBtn">🎙</button>
  <button id="sendBtn">➤</button>
</footer>

<script>
const input = document.getElementById("userInput");
const chat = document.getElementById("chatArea");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

/* ---------- TIME ---------- */
function now() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ---------- FORCE TYPING ENABLE (FIX) ---------- */
input.disabled = false;
input.focus();

/* ENTER KEY SEND */
input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* ---------- VOICE INPUT ---------- */
let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.focus();
  };
  recognition.onend = () => micBtn.classList.remove("listening");
}

micBtn.onclick = () => {
  if (!recognition) return;
  micBtn.classList.add("listening");
  recognition.start();
};

/* ---------- AI VOICE OUTPUT ---------- */
function speakAI(text) {
  if (!window.speechSynthesis) return;
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-IN";
  msg.rate = 0.9;   // slow, senior technician feel
  msg.pitch = 0.8;
  const voices = speechSynthesis.getVoices();
  const male = voices.find(v => v.lang === "en-IN" && v.name.toLowerCase().includes("male"));
  if (male) msg.voice = male;
  speechSynthesis.speak(msg);
}

/* ---------- SEND MESSAGE ---------- */
function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerHTML = `${text}<div class="time">${now()}</div>`;
  chat.appendChild(user);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const thinking = document.createElement("div");
  thinking.className = "message ai thinking";
  thinking.textContent = "NIDAAN AI is thinking...";
  chat.appendChild(thinking);
  chat.scrollTop = chat.scrollHeight;

  setTimeout(() => {
    thinking.remove();

    const typing = document.createElement("div");
    typing.className = "message ai typing";
    typing.textContent = "NIDAAN AI is typing...";
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    fetch("https://n8n-oazxlbnc.us-west-1.clawcloudrun.com/webhook/nidaan-chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      const ai = document.createElement("div");
      ai.className = "message ai";
      ai.innerHTML = `${d.reply}<div class="time">${now()}</div>`;
      chat.appendChild(ai);
      chat.scrollTop = chat.scrollHeight;

      speakAI(d.reply); // 🔊 AI VOICE REPLY
    })
    .catch(() => {
      typing.remove();
    });
  }, 1400);
}
</script>

</body>
</html>
